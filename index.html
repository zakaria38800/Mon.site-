<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Medjekal Zakaria | Création de sites web</title>
  <meta name="description" content="Medjekal Zakaria crée des sites internet modernes, professionnels et adaptés aux besoins des entreprises à Grenoble et partout en France.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    :root {
      --bg: #07111f;
      --bg-light: #0c1a2d;
      --card: #101f33;
      --card-hover: #142842;
      --text: #f5f7fa;
      --muted: #aab7c7;
      --accent: #4f8cff;
      --accent-2: #72a7ff;
      --border: rgba(255,255,255,0.09);
      --success: #38d39f;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* NAVIGATION */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(7,17,31,0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 26px;
      align-items: center;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 14px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-cta {
      padding: 11px 18px;
      background: var(--accent);
      border-radius: 9px;
      color: white !important;
      font-weight: 700;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 100px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(79,140,255,0.16);
      filter: blur(100px);
      border-radius: 50%;
      top: 10%;
      right: -180px;
    }

    .hero-content {
      max-width: 780px;
      position: relative;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(79,140,255,0.35);
      background: rgba(79,140,255,0.09);
      color: var(--accent-2);
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.05;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    h1 span {
      color: var(--accent);
    }

    .hero p {
      color: var(--muted);
      font-size: 19px;
      max-width: 680px;
      margin-bottom: 34px;
    }

    .buttons {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: 700;
      border: 1px solid var(--border);
      transition: transform 0.3s, background 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-2);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.04);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
    }

    /* SECTIONS */

    section {
      padding: 100px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-title .small {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .section-title h2 {
      font-size: clamp(32px, 5vw, 48px);
      margin-bottom: 12px;
    }

    .section-title p {
      max-width: 650px;
      margin: auto;
      color: var(--muted);
    }

    /* SERVICES */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .service-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      transition: 0.3s;
    }

    .service-card:hover {
      transform: translateY(-6px);
      background: var(--card-hover);
    }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(79,140,255,0.12);
      color: var(--accent-2);
      font-size: 22px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      margin-bottom: 10px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* TARIFS */

    .pricing {
      background: var(--bg-light);
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .price-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px;
      position: relative;
    }

    .price-card.featured {
      border: 2px solid var(--accent);
      transform: scale(1.03);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .popular {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .price-card h3 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 42px;
      font-weight: 800;
      margin: 16px 0 8px;
    }

    .price-card > p {
      color: var(--muted);
      font-size: 14px;
      min-height: 68px;
    }

    .features {
      list-style: none;
      margin: 25px 0;
    }

    .features li {
      margin-bottom: 11px;
      color: #d7deea;
      font-size: 14px;
    }

    .features li::before {
      content: "✓";
      color: var(--success);
      font-weight: 800;
      margin-right: 9px;
    }

    .price-card .btn {
      width: 100%;
    }

    .custom-price {
      margin-top: 35px;
      text-align: center;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
    }

    .custom-price h3 {
      margin-bottom: 8px;
    }

    .custom-price p {
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* REALISATIONS */

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .project {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: 0.3s;
    }

    .project:hover {
      transform: translateY(-6px);
    }

    .project-image {
      height: 190px;
      display: grid;
      place-items: center;
      font-size: 44px;
      background: linear-gradient(135deg, #12243d, #0a1728);
      border-bottom: 1px solid var(--border);
    }

    .project-content {
      padding: 22px;
    }

    .project-content h3 {
      margin-bottom: 7px;
    }

    .project-content p {
      color: var(--muted);
      font-size: 14px;
    }

    .demo {
      display: inline-block;
      margin-top: 13px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 700;
    }

    /* ABOUT */

    .about {
      background: var(--bg-light);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about-text h2 {
      font-size: 44px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .about-text p {
      color: var(--muted);
      margin-bottom: 16px;
    }

    .about-box {
      padding: 34px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .about-box h3 {
      margin-bottom: 20px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      gap: 20px;
    }

    .info:last-child {
      border-bottom: none;
